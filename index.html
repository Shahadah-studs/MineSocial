<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MineSocial - Create & Share</title>
 <link rel="icon" type="image/png" href="/logo.png?v=2"> 
  <link rel="stylesheet" href="src/style.css">
</head>
<body class="min-h-screen p-6">
  <!-- Header Bar -->
  <header class="mc-panel flex justify-between items-center mb-6 max-w-4xl mx-auto">
    <h1 class="text-xl text-amber-500 tracking-tight flex items-center gap-2"><img src="svg/logo.svg" width="50" hieght="50" align="left"> MINESOCIAL</h1>
    <div class="flex items-center gap-4">
      <div id="user-badge-container"></div>
      <a href="profile.html" class="btn-primary" title="Edit profile"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-round-pen preview-icon"><path d="M2 21a8 8 0 0 1 10.821-7.487"/><path d="M21.378 16.626a1 1 0 0 0-3.004-3.004l-4.01 4.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/><circle cx="10" cy="8" r="5"/></svg></a>
      <a id="nav-admin-btn" href="admin.html" class="btn-danger hidden"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-user preview-icon"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M6.376 18.91a6 6 0 0 1 11.249.003"/><circle cx="12" cy="11" r="4"/></svg></a>
      <button id="logout-btn" class="logout-x-btn" title="Disconnect">✕</button>
    </div>
  </header>

  <div class="max-w-4xl mx-auto xp-divider"></div>

  <!-- Posting Form with ImgBB Integration -->
  <main class="max-w-4xl mx-auto space-y-6">
    <form id="post-form" class="mc-panel shadow-xl">
      <div class="input-header">POSTS FEED:</div>
      <textarea id="post-content" placeholder="Type a post or share a link here..." maxlength="500" required class="input-field mb-3 resize-none h-24" rows="3"></textarea>
      
      <div class="flex justify-between items-center">
        <!-- ImgBB Upload Control Area -->
        <div class="flex items-center gap-2">
          <span id="upload-status" class="input-header" style="color: #aaaaaa !important; margin: 0;">[IMAGE: NONE]</span>
          <input type="file" id="post-file-input" accept="image/png, image/jpeg, image/webp" style="display: none;">
          <button type="button" onclick="document.getElementById('post-file-input').click()" class="btn-primary" style="font-size: 0.55rem; padding: 0.5rem 0.8rem; background-color: #5c5c5c;">+ UPLOAD</button>
        </div>
        
        <button type="submit" class="btn-primary" title="POST"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-send preview-icon"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></button>
      </div>
    </form>
<a href="credits" 
   
   title="Credits!" 
   id="floatingDiscordBtn"
   onmouseover="this.style.transform='scale(1.2) rotate(360deg)'; this.style.boxShadow='0 0 25px #5865F2, 2px 2px 0px #000000';" 
   onmouseout="this.style.transform='scale(1) rotate(0deg)'; this.style.boxShadow='0 0 15px #5865F2, 4px 4px 0px #000000';"
   style="position: fixed; bottom: 20px; left: 20px; display: flex; align-items: center; justify-content: center; width: 60px; height: 60px; background-color: #5865F2; border: 4px solid #ffffff; border-radius: 50%; box-shadow: 0 0 15px #5865F2, 4px 4px 0px #000000; text-decoration: none; cursor: pointer; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease; z-index: 999999;">
    <span style="font-family: 'Press Start 2P', monospace; font-size: 0.7rem; color: #ffffff; text-shadow: 2px 2px 0px #000000;"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sparkles preview-icon"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/><path d="M20 2v4"/><path d="M22 4h-4"/><circle cx="4" cy="20" r="2"/></svg></span>
</a>
    <!-- Post Feed Target Container -->
    <div id="feed-container" class="space-y-4"></div>
  </main>

  <script type="module" src="src/hub.ts"></script>
</body>
</html>
